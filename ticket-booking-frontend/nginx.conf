server {
    listen 80;
    server_name localhost;

    # Docker internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Root directory containing static frontend build
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        image/svg+xml;

    # Health check endpoint for Docker healthcheck and monitoring
    location /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Proxy API requests to backend Inventory Service
    location /api/ {
        set $inventory_backend http://inventory:4001;
        proxy_pass $inventory_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy health check to backend Inventory Service
    location /health {
        set $inventory_backend http://inventory:4001;
        proxy_pass $inventory_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Fallback all client routes to index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
