
services:
  frontend:
    build: ./ticket-booking-frontend
    image: ticket-frontend
    ports:
      - "3000:80"
    depends_on:
      - inventory
    restart: unless-stopped

  inventory:
    build: ./services/inventory_service
    image: ticket-inventory
    ports:
      - "4001:4001"
    env_file:
      - ./services/inventory_service/.env
    environment:
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      DATABASE_URL: postgresql://ticketuser:password@postgres:5432/ticketbooking
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  order:
    build: ./services/order_service
    image: ticket-order
    env_file:
      - ./services/order_service/.env
    environment:
      DATABASE_URL: postgresql://ticketuser:password@postgres:5432/ticketbooking
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  notification:
    build: ./services/notification_service
    image: ticket-notification
    env_file:
      - ./services/notification_service/.env
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ticketbooking
      POSTGRES_USER: ticketuser
      POSTGRES_PASSWORD: password
    ports:
      - "15433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketuser -d ticketbooking"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  rabbitmq_data:

